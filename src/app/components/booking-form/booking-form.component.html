<div class="booking-form-container">
  <div class="booking-form-wrapper">
    <h3 class="form-title">Seat Booking Form</h3>

    <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()" class="booking-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          placeholder="Enter your name"
          [class.error]="bookingForm.get('name')?.invalid && bookingForm.get('name')?.touched"
        >
        <div class="error-message" *ngIf="bookingForm.get('name')?.invalid && bookingForm.get('name')?.touched">
          <span *ngIf="bookingForm.get('name')?.errors?.['required']">Name is required</span>
          <span *ngIf="bookingForm.get('name')?.errors?.['minlength']">Name must be at least 3 characters</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="busNo">Bus No.</label>
          <input
            type="text"
            id="busNo"
            formControlName="busNo"
            readonly
          >
        </div>

        <div class="form-group">
          <label for="seatNo">Seat No.</label>
          <input
            type="text"
            id="seatNo"
            formControlName="seatNo"
            readonly
          >
        </div>
      </div>

      <div class="form-group">
        <label for="destination">Select Destination</label>
        <select
          id="destination"
          formControlName="destination"
          [class.error]="bookingForm.get('destination')?.invalid && bookingForm.get('destination')?.touched"
        >
          <option value="">Select destination</option>
          <option *ngFor="let dest of destinations" [value]="dest">
            {{dest}}
          </option>
        </select>
        <div class="error-message" *ngIf="bookingForm.get('destination')?.invalid && bookingForm.get('destination')?.touched">
          Please select a destination
        </div>
      </div>

      <div class="form-group">
        <label for="time">Select Time</label>
        <select
          id="time"
          formControlName="time"
          [class.error]="bookingForm.get('time')?.invalid && bookingForm.get('time')?.touched"
        >
          <option value="">Select time</option>
          <option *ngFor="let slot of timeSlots" [value]="slot">
            {{slot}}
          </option>
        </select>
        <div class="error-message" *ngIf="bookingForm.get('time')?.invalid && bookingForm.get('time')?.touched">
          Please select a time
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="bookingComplete.emit()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="bookingForm.invalid">
          Book Seat
        </button>
      </div>
    </form>
  </div>
</div>
