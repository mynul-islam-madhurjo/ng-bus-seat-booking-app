<div class="seat-layout-container">
  <div class="seat-layout-header">
    <h2>{{ isAdminView ? 'Seat Management' : 'Select Your Seat' }}</h2>

    <div class="bus-details" *ngIf="currentBus">
      <div class="bus-number">{{currentBus.busNumber}}</div>
      <div class="bus-route">
        <i class="fas fa-bus"></i>
        {{currentBus.route}}
      </div>
      <div class="bus-time">
        <i class="fas fa-clock"></i>
        Departure: {{currentBus.departureTime}}
      </div>
    </div>

    <div class="seat-info">
      <div class="seat-type">
        <span class="seat available"></span>
        <p>Available</p>
      </div>
      <div class="seat-type">
        <span class="seat booked"></span>
        <p>Booked</p>
      </div>
      <div *ngIf="!isAdminView" class="seat-type">
        <span class="seat selected"></span>
        <p>Selected</p>
      </div>
    </div>
  </div>

  <div class="bus-layout">
    <div class="driver-section">
      <i class="fas fa-steering-wheel"></i>
      <p>Driver</p>
    </div>

    <div class="seats-grid">
      <div class="seat-row" *ngFor="let row of rows">
        <div class="seat-wrapper" *ngFor="let col of columns">
          <div
            class="seat"
            [class.booked]="isSeatBooked(row, col)"
            [class.selected]="!isAdminView && isSeatSelected(row, col)"
            [class.clickable]="isAdminView || !isSeatBooked(row, col)"
            (click)="onSeatClick(row, col)"
          >
            {{row}}{{col}}
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-booking-form
    *ngIf="!isAdminView && showBookingForm && selectedSeat && currentBus"
    [selectedSeat]="selectedSeat"
    [currentBus]="currentBus"
    (bookingComplete)="showBookingForm = false"
  >
  </app-booking-form>

  <app-booking-details-modal
    *ngIf="isAdminView && showAdminModal && selectedBooking"
    [booking]="selectedBooking"
    (onClose)="closeAdminModal()"
  >
  </app-booking-details-modal>
</div>
